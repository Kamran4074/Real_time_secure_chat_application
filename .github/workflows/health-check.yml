name: Daily health check

on:
  schedule:
    # every day at 06:00 UTC (11:30 IST)
    - cron: "0 6 * * *"
  workflow_dispatch: # lets you run it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HEALTH_URL: ${{ vars.HEALTH_URL || 'https://chatwave-backend-biic.onrender.com/api/health' }}
    steps:
      - name: Ping backend
        run: |
          # Render free tier can take ~1 min to wake up, so retry a few times
          for attempt in 1 2 3 4 5; do
            status=$(curl -s -o response.json -w "%{http_code}" --max-time 90 "$HEALTH_URL" || echo "000")
            echo "Attempt $attempt: HTTP $status"
            if [ "$status" = "200" ]; then
              cat response.json
              exit 0
            fi
            sleep 30
          done
          echo "::error::Health check failed for $HEALTH_URL"
          cat response.json 2>/dev/null || true
          exit 1
