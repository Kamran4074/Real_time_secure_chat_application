# Runs the whole app locally: MongoDB + backend + frontend
#   docker compose up --build
# Frontend: http://localhost:8080   Backend: http://localhost:3000
# Secrets (JWT_SECRET, OAuth keys) are read from backend/.env

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    # not published to the host, only the backend can reach it
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - path: ./backend/.env
        required: false # without it the backend exits with "JWT_SECRET is required"
    # these override the values from backend/.env when running in Docker
    environment:
      PORT: 3000
      MONGODB_CONNECT: mongodb://mongo:27017/chatapp
      CLIENT_ORIGINS: http://localhost:8080
      SERVER_URL: http://localhost:3000
      CLIENT_URL: http://localhost:8080
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BACKEND_URL: http://localhost:3000
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  mongo-data:
